name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "*.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend-amd64:
    uses: ./.github/workflows/build-image.yml
    with:
      platform: linux/amd64
      runner: ubuntu-latest
      tag-suffix: amd64
      service: backend
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend-arm64:
    uses: ./.github/workflows/build-image.yml
    with:
      platform: linux/arm64
      runner: ubuntu-24.04-arm
      tag-suffix: arm64
      service: backend
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web-amd64:
    uses: ./.github/workflows/build-image.yml
    with:
      platform: linux/amd64
      runner: ubuntu-latest
      tag-suffix: amd64
      service: web
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_ALLOWED_FILE_TYPES: ${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES }}
      NEXT_PUBLIC_MAX_FILE_SIZE: ${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
      NEXT_PUBLIC_IMGUR_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_IMGUR_CLIENT_ID }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_AXIOM_DATASET: ${{ secrets.NEXT_PUBLIC_AXIOM_DATASET }}
      NEXT_PUBLIC_AXIOM_TOKEN: ${{ secrets.NEXT_PUBLIC_AXIOM_TOKEN }}

  build-web-arm64:
    uses: ./.github/workflows/build-image.yml
    with:
      platform: linux/arm64
      runner: ubuntu-24.04-arm
      tag-suffix: arm64
      service: web
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_ALLOWED_FILE_TYPES: ${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES }}
      NEXT_PUBLIC_MAX_FILE_SIZE: ${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
      NEXT_PUBLIC_IMGUR_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_IMGUR_CLIENT_ID }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_AXIOM_DATASET: ${{ secrets.NEXT_PUBLIC_AXIOM_DATASET }}
      NEXT_PUBLIC_AXIOM_TOKEN: ${{ secrets.NEXT_PUBLIC_AXIOM_TOKEN }}

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-backend-amd64, build-backend-arm64, build-web-amd64, build-web-arm64]
    permissions:
      contents: read
      packages: write
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push backend manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}-arm64

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}-arm64
          fi

      - name: Create and push web manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}-arm64

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}-arm64
          fi

  trigger-coolify:
    runs-on: ubuntu-latest
    needs: [create-manifest]
    if: success()
    environment: ${{ github.ref_name }}
    steps:
      - name: Trigger Coolify deployment for dev
        if: github.ref_name == 'dev'
        run: |
          curl -s -X POST "https://coolify.omarzunic.com/api/v1/deploy?uuid=c4w40o4wgsgkc4ck40skgw8k&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

      - name: Trigger Coolify deployment for main
        if: github.ref_name == 'main'
        run: |
          curl -s -X POST "https://coolify.omarzunic.com/api/v1/deploy?uuid=h40oksokkcgs40k00osk4ccw&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
