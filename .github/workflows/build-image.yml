name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: "Platform to build for (linux/amd64 or linux/arm64)"
      runner:
        required: true
        type: string
        description: "Runner to use for the build"
      tag-suffix:
        required: true
        type: string
        description: "Tag suffix for the image (amd64 or arm64)"
      service:
        required: true
        type: string
        description: "Service to build (backend or web)"
    secrets:
      REGISTRY_TOKEN:
        required: true
      NEXT_PUBLIC_CDN_URL:
        required: false
      NEXT_PUBLIC_BETTER_AUTH_URL:
        required: false
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:
        required: false
      NEXT_PUBLIC_ALLOWED_FILE_TYPES:
        required: false
      NEXT_PUBLIC_MAX_FILE_SIZE:
        required: false
      NEXT_PUBLIC_IMGUR_CLIENT_ID:
        required: false
      NEXT_PUBLIC_TURNSTILE_SITE_KEY:
        required: false
      NEXT_PUBLIC_AXIOM_DATASET:
        required: false
      NEXT_PUBLIC_AXIOM_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ inputs.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set beta flag
        id: beta
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Log build info
        run: |
          echo "Building for branch: ${{ github.ref_name }}"
          echo "Service: ${{ inputs.service }}"
          echo "Beta mode: ${{ steps.beta.outputs.value }}"
          echo "Platform: ${{ inputs.platform }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ inputs.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ inputs.service }}:${{ github.sha }}-${{ inputs.tag-suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platform }}
          cache-from: type=gha,scope=${{ inputs.service }}-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-${{ inputs.platform }}
          build-args: |
            NEXT_PUBLIC_CDN_URL=${{ secrets.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.NEXT_PUBLIC_BETTER_AUTH_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ALLOWED_FILE_TYPES=${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES }}
            NEXT_PUBLIC_MAX_FILE_SIZE=${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
            NEXT_PUBLIC_SOURCE_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_IMGUR_CLIENT_ID=${{ secrets.NEXT_PUBLIC_IMGUR_CLIENT_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_AXIOM_DATASET=${{ secrets.NEXT_PUBLIC_AXIOM_DATASET }}
            NEXT_PUBLIC_AXIOM_TOKEN=${{ secrets.NEXT_PUBLIC_AXIOM_TOKEN }}
            NEXT_PUBLIC_BETA=${{ steps.beta.outputs.value }}
            CI=true
