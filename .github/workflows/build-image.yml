name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: "Platform to build for (linux/amd64 or linux/arm64)"
      runner:
        required: true
        type: string
        description: "Runner to use for the build"
      tag-suffix:
        required: true
        type: string
        description: "Tag suffix for the image (amd64 or arm64)"
    secrets:
      REGISTRY_TOKEN:
        required: true
      NEXT_PUBLIC_CDN_URL:
        required: false
      NEXT_PUBLIC_BETTER_AUTH_URL:
        required: false
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:
        required: false
      NEXT_PUBLIC_ALLOWED_FILE_TYPES:
        required: false
      NEXT_PUBLIC_MAX_FILE_SIZE:
        required: false
      NEXT_PUBLIC_IMGUR_CLIENT_ID:
        required: false
      NEXT_PUBLIC_TURNSTILE_SITE_KEY:
        required: false
      NEXT_PUBLIC_AXIOM_DATASET:
        required: false
      NEXT_PUBLIC_AXIOM_TOKEN:
        required: false
      COOLIFY_API_KEY:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ inputs.tag-suffix }}-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ inputs.tag-suffix }}-${{ hashFiles('**/bun.lock') }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ inputs.tag-suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platform }}
          cache-from: type=gha,scope=${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.platform }}
          build-args: |
            NEXT_PUBLIC_CDN_URL=${{ secrets.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.NEXT_PUBLIC_BETTER_AUTH_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ALLOWED_FILE_TYPES=${{ secrets.NEXT_PUBLIC_ALLOWED_FILE_TYPES }}
            NEXT_PUBLIC_MAX_FILE_SIZE=${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
            NEXT_PUBLIC_SOURCE_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_IMGUR_CLIENT_ID=${{ secrets.NEXT_PUBLIC_IMGUR_CLIENT_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_AXIOM_DATASET=${{ secrets.NEXT_PUBLIC_AXIOM_DATASET }}
            NEXT_PUBLIC_AXIOM_TOKEN=${{ secrets.NEXT_PUBLIC_AXIOM_TOKEN }}
            CI=true

      - name: Trigger Coolify deployment (ARM builds only)
        if: success() && inputs.tag-suffix == 'arm64'
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            COOLIFY_URL="https://coolify.omarzunic.com/api/v1/deploy?uuid=c4w40o4wgsgkc4ck40skgw8k&force=false"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            COOLIFY_URL="https://coolify.omarzunic.com/api/v1/deploy?uuid=h40oksokkcgs40k00osk4ccw&force=false"
          else
            echo "Skipping Coolify deployment for branch: ${{ github.ref_name }}"
            exit 0
          fi

          curl -s -X POST "$COOLIFY_URL" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
            -H "Content-Type: application/json" > /dev/null
